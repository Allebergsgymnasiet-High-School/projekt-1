            <p>Här kan du skriva dina uppgifer och ditt ärende så att du kan kontakta oss!</p>

        <fieldset> 
            <legend>Dina uppgifter</legend>
    
        <form>
            <p>
            <label for="name">Namn:</label>
            <input type="text" name="name" id="name" autocomplete="name" required>
            </p>

            <p>
            <label for="email">E-Post:</label>
            <input type="email" name="email" id="email" autocomplete="email" required>
            </p>

            
            <label for="subject">Ämne:</label>
            <input type="text" name="subject" id="subject" pattern="[A-Za-zÅÄÖåäö]+" maxlength="30"/>
            

        
            <label for="description">Beskriv ditt ärende:</label>
            <textarea name="description" id="description"></textarea>
            
        </form>
        </fieldset>
